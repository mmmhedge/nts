<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Tuner</h1>
    <nav>
      <button class="tab-btn active" data-tab="stations">Stations</button>
      <button class="tab-btn" data-tab="search">Search</button>
    </nav>
  </header>

  <section class="now-playing">
    <img id="np-artwork" alt="" />
    <div class="np-text">
      <div id="np-title">Nothing playing</div>
      <div id="np-sub"></div>
      <div id="np-remaining"></div>
    </div>
    <button id="np-favorite" title="Favorite">★</button>
  </section>

  <section class="transport">
    <button id="play-pause">▶</button>
    <span style="color:#555;font-size:11px;flex-shrink:0">VOL</span>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="1" />
  </section>

  <main id="tab-stations" class="tab-panel">
    <div class="section-label">Recent</div>
    <ul id="history-list" class="item-list"></ul>
    <div class="section-label">Favorites</div>
    <ul id="favorites-list" class="item-list"></ul>
    <div class="section-label">Live Channels</div>
    <ul id="live-list" class="item-list"></ul>
    <div class="section-label">Infinite Mixtapes</div>
    <ul id="mixtape-list" class="item-list"></ul>
  </main>

  <main id="tab-search" class="tab-panel hidden">
    <div class="search-wrap">
      <input id="search-input" type="text" placeholder="Search shows & episodes…" />
    </div>
    <ul id="search-results" class="item-list"></ul>
  </main>

  <footer>
    <span class="error" id="error-banner"></span>
    Unofficial — not affiliated with NTS.
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
